project:
  type: website
  output-dir: docs
  
website:
  title: "NYC Ferry Delay Prediction"
  page-footer:
    left: "© 2026 | MUSA Practicum"
    right: 
      - text: "University of Pennsylvania Weitzman School of Design"
  navbar:
    background: primary
    search: true
    right:
      - icon: github
        href: https://github.com/kakumanus/musa-8010-nycedc
        aria-label: GitHub

format:
  html:
    theme: 
      light: [flatly, nycferry.scss]
      dark: [darkly, nycferry-dark.scss]
    toc: true
    toc-depth: 3
    toc-location: left
    toc-title: "On This Page"
    code-fold: true
    code-tools: true
    code-copy: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: true
    anchor-sections: true
    fig-cap-location: bottom
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 250px

execute:
  freeze: auto
  cache: false
  warning: false
  message: false